[project]
name = "ComfyUI-Copilot"
description = "Your Intelligent Assistant for Comfy-UI."
version = "2.0.28"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/AIDC-AI/ComfyUI-Copilot"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "yx9966"
DisplayName = "ComfyUI-Copilot"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is itself a package (ComfyUI loads __init__.py); don't let pytest import it.
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*SQLAlchemy 2.0.*"]
