[project]
name = "ComfyUI-Copilot"
description = "Your Intelligent Assistant for Comfy-UI."
version = "2.0.28"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/AIDC-AI/ComfyUI-Copilot"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "yx9966"
DisplayName = "ComfyUI-Copilot"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is itself a package (ComfyUI loads __init__.py); don't let pytest import it.
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*SQLAlchemy 2.0.*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["ui", "dist", "entry"]

[tool.ruff.lint]
# Bug-class rules only for now (syntax errors, undefined names, redefinitions, dead locals,
# mutable defaults). Widen once the inherited code has been cleaned up.
select = ["E9", "F63", "F7", "F82", "F811", "F841", "B006", "B012"]
